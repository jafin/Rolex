name: Release

# Push a tag such as v0.9.1 to publish a GitHub release holding rolex.exe,
# rolex.exe.config and a SHA-256 file. The tag is the version: the release is
# built from the tagged commit and only published if the tests pass on it.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build, test and publish (Windows)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: msbuild Rolex.sln -t:Restore -v:minimal -nologo

      # Same order as build.yml: the demos call the generator from a pre-build
      # event, so it has to exist before the solution builds.
      - name: Build generator
        run: msbuild Rolex\Rolex.csproj -t:Build -p:Configuration=Release -p:SolutionDir="$pwd\" -v:minimal -nologo

      - name: Build solution
        run: msbuild Rolex.sln -p:Configuration=Release -v:minimal -nologo -m

      - name: Test
        run: dotnet test Rolex.Tests\Rolex.Tests.csproj -c Release --no-build --nologo

      - name: Stage generator
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item Rolex\bin\Release\rolex.exe, Rolex\bin\Release\rolex.exe.config dist\
          $hash = (Get-FileHash dist\rolex.exe -Algorithm SHA256).Hash
          "$hash  rolex.exe" | Set-Content dist\rolex.exe.sha256
          "rolex.exe SHA-256 $hash" >> $env:GITHUB_STEP_SUMMARY

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: >
          gh release create $env:TAG dist/rolex.exe dist/rolex.exe.config dist/rolex.exe.sha256
          --title $env:TAG --generate-notes --verify-tag
